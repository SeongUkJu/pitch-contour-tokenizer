[project]
name = "pitch-contour-tokenizer"
version = "0.1.0"
description = "1D Conv (VQ-)VAE models for pitch-contour tokenization (ISMIR 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Numeric-stack versions are pinned to the paper environment (Python 3.10,
# PyTorch 2.8.0 + CUDA 12.8, scikit-learn 1.6.1): the AE baseline's post-hoc
# token space (StandardScaler -> UMAP -> KMeans) is refit at analysis time and
# its metrics only reproduce the reported numbers under these exact versions.
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==2.2.6",
    "pandas>=2.0",
    "scikit-learn==1.6.1",
    "umap-learn==0.5.12",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "wandb>=0.16",
]

[tool.uv]
package = false
# pin the UMAP numeric backends to the paper environment as well
constraint-dependencies = ["numba==0.66.0", "pynndescent==0.5.13", "llvmlite>=0.42"]
