[project]
name = "pitch-contour-tokenizer"
version = "0.1.0"
description = "1D Conv (VQ-)VAE models for pitch-contour tokenization (ISMIR 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "wandb>=0.16",
]

[tool.uv]
package = false
# forbid ancient numba/llvmlite that universal resolution would otherwise
# fall back to (they declare no upper Python bound but cannot build on 3.10+)
constraint-dependencies = ["numba>=0.59", "llvmlite>=0.42"]
